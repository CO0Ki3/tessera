<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tessera — ragged axes</title>
<link rel="stylesheet" href="./harness.css">
</head>
<body>

<h1><a href="./" style="color:inherit">tessera</a> — ragged axes</h1>
<p class="sub">
  The same kernel body at <b>1000 &times; 750 &times; 500</b>, where no axis divides its
  block. Every boundary condition is synthesised by the compiler from the extents
  in the types; the loop, the accumulator and the store are character-identical to
  the aligned kernel.
</p>

<button id="run">Run</button>
<pre id="log">Ready.</pre>

<script type="module">
import { initDevice } from "./run.js";
import { attachCopyButton } from "./copy.js";
import { measureInterleaved } from "./measure.js";
import { makeRunner, typegpuStatus } from "./runners.js";
const TYPEGPU = await typegpuStatus();
import { randomF32, matmulReluF32, allClose, summarize, bitExactCount,
         dotAbsSum, withinErrorBound } from "./oracle.js";

const logEl = document.getElementById("log");
const btn = document.getElementById("run");
attachCopyButton(btn, logEl);
let buf = "";
const write = (s = "") => { buf += s + "\n"; logEl.innerHTML = buf; };
const yieldToPaint = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
const f = (x, n = 3) => Number(x).toFixed(n);

btn.addEventListener("click", async () => {
  btn.disabled = true; buf = "";
  try { await main(); }
  catch (e) { write(`\n<span class="bad">FAILED</span>  ${e.message}`); }
  finally { btn.disabled = false; }
});

async function main() {
  // ---- what the compiler decided ------------------------------------------
  const man = await (await fetch("./matmul-ragged.json")).json();
  const M = man.axes.m, N = man.axes.n, K = man.axes.k;
  const dims = { M, N, K };

  write("── what tessera derived from the types ────────────");
  write(`kernel        ${man.name}   entry "${man.entryPoint}"`);
  write(`axes          m=${M}  n=${N}  k=${K}`);
  write(`workgroup     ${man.workgroup.join("x")}   fragment ${man.fragment.join("x")}   ` +
        `dispatch ${man.dispatch.join("x")}`);
  write(`pad           ${man.pad}   <span class="dim">(the one fact the compiler cannot infer)</span>`);
  write(`masked        ${man.maskedLoads.join("  ")}`);
  write("");
  write(`<span class="dim">tail blocks:  m ${M} = ${man.dispatch[1] - 1}x64 + ${M % 64}` +
        `   n ${N} = ${man.dispatch[0] - 1}x64 + ${N % 64}   k ${K} = ${Math.floor(K / 16)}x16 + ${K % 16}</span>`);
  write("");

  // ---- the source diff, which is the whole point ---------------------------
  write("── what the user wrote differently ────────────────");
  write(`  <span class="dim">-</span> const M = axis("m", 1024, T.bm);`);
  write(`  <span class="add">+</span> const M = raggedAxis("m", 1000, T.bm);`);
  write(`  <span class="dim">-</span>   acc = mma(a.tile(at.m, k), b.tile(k, at.n), acc);`);
  write(`  <span class="add">+</span>   acc = mma(a.tile(at.m, k).pad(0), b.tile(k, at.n).pad(0), acc);`);
  write(`<span class="dim">  ...and nothing else. No mask expressions anywhere in the body.</span>`);
  write("");

  // ---- run -----------------------------------------------------------------
  const ctx = await initDevice();
  write("── run ────────────────────────────────────────────");
  write(`adapter       ${ctx.adapterInfo.vendor} / ${ctx.adapterInfo.architecture}`);

  const a = randomF32(M * K, 0x1234);
  const b = randomF32(K * N, 0x5678);

  // Both backends, interleaved so the comparison is not an ordering artefact.
  const BACKENDS = [
    { key: "mlir",   file: "./matmul-ragged.wgsl",        man, label: "via MLIR " },
    { key: "direct", file: "./matmul-ragged-direct.wgsl", manFile: "./matmul-ragged-direct.json",
      label: "direct   " },
    // The direct kernel again, with TypeGPU owning the buffers and the bind
    // group. This is the kernel where getting the binding order wrong matters
    // most: 18 synthesised masks mean a swapped operand still produces
    // plausible-looking finite numbers in the tails rather than an obvious
    // crash, so "bit-exact against the raw path" is the check with teeth.
    { key: "typegpu", file: "./matmul-ragged-direct.wgsl", manFile: "./matmul-ragged-direct.json",
      runtime: "typegpu", label: "TypeGPU  " },
  ];
  const runners = [];
  for (const bk of BACKENDS) {
    if (bk.runtime === "typegpu" && !TYPEGPU.available) {
      write(`${bk.label}     <span class="warn">skipped</span> — ${TYPEGPU.reason}`);
      continue;
    }
    const m2 = bk.man ?? await (await fetch(bk.manFile)).json();
    let src;
    try { src = await (await fetch(bk.file)).text(); }
    catch { write(`${bk.label}  <span class="warn">skipped</span>`); continue; }
    const { runner, messages } = await makeRunner(ctx, {
      runtime: bk.runtime, source: src, manifest: m2, inputs: [a, b], label: bk.key,
    });
    for (const mm of messages) write(`<span class="warn">${mm.type}</span> ${mm.message}`);
    write(`${bk.label}     ${String(src.split("\n").length).padStart(4)} lines   ` +
          `${String(src.match(/< \d+u\)/g)?.length ?? 0).padStart(3)} synthesised bound checks`);
    runners.push({ bk, r: runner });
  }
  if (!runners.length) throw new Error("nothing compiled");

  const stats = await measureInterleaved(runners.map((x) => x.r), { warmup: 6, reps: 20 });
  write("");
  for (const { bk } of runners) {
    const st = stats.get(bk.key);
    if (!st) continue;
    write(`${bk.label}     min ${String(st.minQ).padStart(3)}q  med ${String(st.medianQ).padStart(3)}q  ` +
          `spread ${String(st.spreadQ).padStart(2)}q   ` +
          `${f(2 * M * N * K / (st.minNs * 1e-9) / 1e9, 1).padStart(7)} GFLOP/s`);
  }
  const outs = {};
  for (const { bk, r } of runners) outs[bk.key] = await r.result();
  const got = outs.mlir ?? outs.direct;
  const s = summarize(got);
  write(`output        min ${f(s.min)}  max ${f(s.max)}  mean ${f(s.mean)}  ` +
        `zeros ${s.zeros}  nans ${s.nans}`);
  if (outs.mlir && outs.direct) {
    const same = bitExactCount(outs.direct, outs.mlir);
    write(`backends agree  bit-exact ${same} / ${got.length}` +
          (same === got.length ? `  <span class="ok">IDENTICAL</span>`
                               : `  <span class="bad">DIVERGENT</span>`));
  }
  if (outs.typegpu && outs.direct) {
    const same = bitExactCount(outs.typegpu, outs.direct);
    write(`TypeGPU agrees  bit-exact ${same} / ${got.length}` +
          (same === got.length ? `  <span class="ok">IDENTICAL</span>`
                               : `  <span class="bad">DIVERGENT — the adapter is binding ` +
                                 `something differently</span>`));
  }
  write("");

  // ---- the check -----------------------------------------------------------
  write("── differential ───────────────────────────────────");
  write(`<span class="dim">CPU reference over ${(2 * M * N * K / 1e6).toFixed(0)}M flops…</span>`);
  await yieldToPaint();

  const want = matmulReluF32(a, b, dims, { contract: true });
  const exact = bitExactCount(got, want);
  write(`bit-exact vs FMA reference   ${exact} / ${got.length}  ` +
        `(${(100 * exact / got.length).toFixed(4)}%)`);

  if (exact === got.length) {
    write("");
    write(`<span class="ok">PASS</span>  every masked lane is right, including the ` +
          `${M % 64}-row, ${N % 64}-column and ${K % 16}-deep tails.`);
    write(`<span class="dim">A wrong mask would not be subtle here: it would read a neighbouring row,</span>`);
    write(`<span class="dim">or accumulate garbage past the k tail, and the diff would be O(1).</span>`);
  } else {
    const cmp = allClose(got, want, { rtol: 1e-5, atol: 1e-6 });
    write(`maxAbsDiff  ${cmp.maxAbsDiff.toExponential(3)}`);
    if (cmp.worstIndex >= 0) {
      const r = Math.floor(cmp.worstIndex / N), c = cmp.worstIndex % N;
      write(`worst       c[${r}][${c}]  gpu ${cmp.worstGot}  cpu ${cmp.worstWant}` +
            `   <span class="dim">(tail starts at row ${M - (M % 64)}, col ${N - (N % 64)})</span>`);
    }
    const absSum = dotAbsSum(a, b, dims);
    const bound = withinErrorBound(got, want, absSum, K);
    write("");
    write(bound.ok
      ? `<span class="warn">NOT BIT-EXACT, but inside the f32 error bound</span> — worst ratio ` +
        `${f(bound.worstRatio, 4)}. Suspect the accumulation order, not the masks.`
      : `<span class="bad">FAIL</span>  ${bound.violations} elements exceed what f32 permits. ` +
        `That is a mask bug, not rounding.`);
  }
  for (const { r } of runners) r.destroy();
}
</script>
</body>
</html>
